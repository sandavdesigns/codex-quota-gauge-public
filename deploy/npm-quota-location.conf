# Paste into the Advanced tab of the gauge.example.org proxy host.
# Backend MUST have DEVICE_TOKEN_FILE configured before enabling this host.
# NPM details: http -> 192.168.1.50:8787; valid certificate; Force SSL enabled.
# Only this exact read-only path is proxied. No dashboard or health route is public.
location = /v1/quota {
    if ($request_method != GET) { return 405; }
    if ($args != "") { return 400; }
    proxy_pass http://192.168.1.50:8787/v1/device-quota;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_connect_timeout 5s;
    proxy_read_timeout 10s;
    proxy_buffering off;
    proxy_hide_header Set-Cookie;
    add_header Cache-Control "no-store" always;
    access_log off;
}
# Server-level guards also cover NPM's generated / location.
# ACME HTTP-01 remains available for certificate renewal.
if ($uri !~ "^(/v1/quota|/\.well-known/acme-challenge/[^/]+)$") { return 404; }
